---
layout: null
---
{% assign d = site.data.club %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ d.seo.title | escape }}</title>
<meta name="robots" content="index,follow">
<meta name="description" content="{{ d.seo.description | escape }}">
<link rel="canonical" href="https://www.maisonbaer.ch/">
<meta name="theme-color" content="#ebe4d8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="{{ d.seo.title | escape }}">
<meta property="og:description" content="{{ d.seo.share_description | escape }}">
<meta property="og:image" content="https://www.maisonbaer.ch{{ d.seo.share_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="site.css">
<style>
html{scroll-behavior:smooth}
body{text-rendering:optimizeLegibility;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.btn{display:inline-block;position:relative;font-family:var(--sc);font-weight:600;text-transform:lowercase;letter-spacing:.32em;font-size:.95rem;padding:16px 36px;background:none;cursor:pointer;transition:background .5s,color .5s}

/* the house */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 24px 0}
.hero .wappen{display:block;height:clamp(130px,19.5vh,175px);width:auto;margin:0 auto 26px;image-rendering:-webkit-optimize-contrast}.hero .wappen.on{opacity:1}
.hero h1{font-family:var(--disp);font-weight:500;font-size:1.2rem;letter-spacing:.34em;padding-left:.34em;white-space:nowrap;text-transform:uppercase;line-height:1;color:var(--ink)}
/* two painted views of Zürich that bleed out of the corners into the paper, with no visible edge */
.paint{display:block;width:min(420px,100%);height:auto;margin:24px auto 0;mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 calc(45% * var(--p)),transparent calc(100% * var(--p)));
  mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 calc(45% * var(--p)),transparent calc(100% * var(--p)))}
.paint.boat{margin-top:40px}
@media (min-width:1025px){
  main{position:relative;overflow:hidden}
  .hero,.prose{position:relative;z-index:1}
  .paint{position:absolute;z-index:0;width:27vw;max-width:440px;margin:0;pointer-events:none}
  .paint.church{top:0;right:0;transform:translate(6%,-6%);
    -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 24%),radial-gradient(ellipse 135% 100% at 100% 0%,#000 calc(52% * var(--p)),rgba(0,0,0,.6) calc(72% * var(--p)),transparent calc(92% * var(--p)));-webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent 0%,#000 24%),radial-gradient(ellipse 135% 100% at 100% 0%,#000 calc(52% * var(--p)),rgba(0,0,0,.6) calc(72% * var(--p)),transparent calc(92% * var(--p)));mask-composite:intersect}
  .paint.boat{bottom:0;left:0;margin:0;transform:translate(-6%,6%);
    -webkit-mask-image:linear-gradient(to top,transparent 0%,#000 18%),radial-gradient(ellipse 100% 100% at 0% 100%,#000 calc(46% * var(--p)),rgba(0,0,0,.55) calc(68% * var(--p)),transparent calc(88% * var(--p)));-webkit-mask-composite:source-in;
    mask-image:linear-gradient(to top,transparent 0%,#000 18%),radial-gradient(ellipse 100% 100% at 0% 100%,#000 calc(46% * var(--p)),rgba(0,0,0,.55) calc(68% * var(--p)),transparent calc(88% * var(--p)));mask-composite:intersect}
}
.house{flex:1 0 auto;display:flex;flex-direction:column}
main{display:block;flex:1 0 auto}
.prose{width:min(594px,100%);margin:0 auto;padding:clamp(28px,4.5vh,40px) 24px clamp(40px,7vh,90px);text-align:center}
.prose p{font-size:1.15rem;line-height:1.56;color:var(--ink);text-wrap:balance}
.prose p+p{margin-top:1.56em}
.prose em{font-style:italic}
.actions{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:20px}
.house .btn{color:var(--ink);border:1px solid var(--ink);width:min(330px,100%);padding:22px 0;font-size:.8rem;letter-spacing:.3em}
.house .btn:hover,.house .btn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.rv{opacity:0;transform:translateY(10px);transition:opacity 1.6s ease,transform 1.6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media (min-width:1025px) and (max-height:760px){.prose p+p{margin-top:1.1em}}
/* the paintings spread out of their corner like wet paint, once, when the page opens */
@property --p{syntax:'<number>';inherits:false;initial-value:1}
@keyframes bleed{from{--p:.12;opacity:.15;filter:blur(5px) saturate(.35)}60%{opacity:1}to{--p:1;opacity:1;filter:none}}
.paint{animation:bleed 3.2s cubic-bezier(.22,.61,.36,1) .25s both;animation-play-state:paused}.paint.seen{animation-play-state:running}
/* the line under the name, set like the page titles on the other pages */
.lede{font-family:'EB Garamond',Georgia,serif;font-weight:400;font-size:clamp(1.6rem,3vw,1.9rem);line-height:1.1;color:var(--ink);margin:0 0 clamp(26px,4vh,52px);text-wrap:balance}
@media (min-width:1025px) and (max-height:720px){.lede{font-size:1.75rem;margin-bottom:12px}.prose{padding-top:18px}}
/* the house signs the page */
@font-face{font-family:'Monsieur La Doulaise';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/monsieur-la-doulaise-latin-400-normal.woff2) format('woff2')}
.prose p.sig{display:block;margin:clamp(34px,6.6vh,60px) auto 0;font-family:'Monsieur La Doulaise',cursive;font-weight:400;font-size:clamp(36px,4.8vh,46px);line-height:1;color:var(--ink);opacity:.92;white-space:nowrap}
@media (min-width:1025px) and (max-height:720px){.prose p.sig{margin-top:22px}}
</style>
</head>
<body>
<nav class="nav" aria-label="Main"><a href="index.html" aria-current="page">The Club</a><a href="history.html">History</a><a href="membership.html">Membership</a></nav>

<div class="house">
<main>
<section class="hero" aria-label="Maison Baer">
  <img class="wappen" id="wappen" src="img/maison-baer-wappen.webp" alt="Maison Baer" width="344" height="500">
  <h1>Maison Baer</h1>
</section>
  <img class="paint church" src="{{ d.painting_top.image }}" alt="{{ d.painting_top.alt | escape }}" width="880" height="1100" decoding="async">

<section class="prose">
  <h2 class="lede">{{ d.heading | escape }}</h2>
{%- for p in d.paragraphs %}
  <p>{{ p }}</p>
{%- endfor %}
  <p class="sig" aria-label="Maison Baer">Maison Baer</p>
</section>
  <img class="paint boat" src="{{ d.painting_bottom.image }}" alt="{{ d.painting_bottom.alt | escape }}" width="880" height="1100" loading="lazy" decoding="async">
</main>

<footer><span>Maison Baer · Zürich · MMXXVI</span><a href="legal.html">Legal Notice</a></footer>
</div>

<script>
(function(){
/* reveal */
function open(){
  document.getElementById("wappen").classList.add("on");
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.2});
  document.querySelectorAll(".rv").forEach(function(n,ix){if(n.closest(".hero"))n.style.transitionDelay=(.3+ix*.4)+"s";io.observe(n)});
}
open();
})();
</script>
<script>
/* start the paint effect only when a painting actually comes into view (matters on phones, where they sit below the text) */
(function(){var ps=document.querySelectorAll('.paint');if(!('IntersectionObserver' in window)){ps.forEach(function(p){p.classList.add('seen')});return}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('seen');io.unobserve(e.target)}})},{threshold:.25});
ps.forEach(function(p){io.observe(p)})})();
</script>
</body>
</html>
