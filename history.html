---
layout: null
---
{% assign d = site.data.history %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ d.seo.title | escape }}</title>
<meta name="robots" content="index,follow">
<meta name="description" content="{{ d.seo.description | escape }}">
<link rel="canonical" href="https://www.maisonbaer.ch/history.html">
<meta name="theme-color" content="#ebe4d8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="site.css">
<style>
:root{--ink2:#4a5a4f;--gold:#a8823d}
body{font-size:1.15rem;line-height:1.56}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .3s}
a:hover{border-color:var(--ink)}
.sc{font-family:var(--sc);font-weight:500;letter-spacing:.34em;text-transform:lowercase;font-size:.92rem;color:var(--gold)}
header{display:flex;justify-content:center;padding:30px 24px 0}
header .brand{border:0;display:flex;flex-direction:column;align-items:center;gap:26px;color:var(--ink)}
.wappen{display:block;height:clamp(130px,19.5vh,175px);width:auto;image-rendering:-webkit-optimize-contrast}
.wm{font-family:var(--disp);font-weight:500;font-size:1.2rem;letter-spacing:.34em;padding-left:.34em;white-space:nowrap;text-transform:uppercase;line-height:1}
main{width:min(642px,100%);margin:0 auto;padding:clamp(28px,4.5vh,40px) 24px clamp(40px,7vh,90px)}
h1{font-weight:400;font-size:clamp(1.6rem,3vw,1.9rem);line-height:1.1;text-align:center;margin:0 0 clamp(26px,4vh,52px)}
.lead{text-align:center}
section{padding:30px 0;border-top:1px solid var(--line)}
section:last-of-type{border-bottom:1px solid var(--line)}
h2{font-family:var(--sc);font-weight:500;text-transform:lowercase;letter-spacing:.26em;font-size:1rem;color:var(--gold);margin-bottom:12px}
p{color:var(--ink)}
p+p{margin-top:12px}
address{font-style:normal;color:var(--ink)}
.back{text-align:center;margin-top:clamp(44px,7vh,64px)}
.back a{font-family:var(--sc);font-weight:600;text-transform:lowercase;letter-spacing:.3em;font-size:.95rem;border:1px solid var(--ink);padding:14px 32px;display:inline-block;color:var(--ink);transition:background .4s,color .4s}
.back a:hover{background:var(--ink);color:var(--paper)}
.prose p{color:var(--ink);font-size:1.15rem;line-height:1.56;text-align:center;text-wrap:balance}
.prose p+p{margin-top:1.56em}
.prose em{font-style:italic}
.cta{text-align:center;margin-top:clamp(24px,4vh,56px)}
.cta a{font-family:var(--sc);font-weight:600;text-transform:lowercase;letter-spacing:.3em;font-size:.85rem;border:1px solid var(--ink);padding:clamp(15px,2.5vh,20px) 0;width:min(330px,100%);display:inline-block;color:var(--ink);transition:background .4s,color .4s}
.cta a:hover{background:var(--ink);color:var(--paper)}
/* a painted view of Zürich that bleeds out of the corners into the paper, with no visible edge */
.paint{display:block;width:min(420px,100%);height:auto;margin:24px auto 0;mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 calc(45% * var(--p)),transparent calc(100% * var(--p)));
  mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 calc(45% * var(--p)),transparent calc(100% * var(--p)))}
.paint.boat{margin-top:40px}
@media (min-width:1025px){
  .page{position:relative;overflow:hidden}
  header,main{position:relative;z-index:1}
  .paint{position:absolute;z-index:0;width:27vw;max-width:440px;margin:0;pointer-events:none}
  .paint.church{top:0;right:0;transform:translate(17%,-6%);
    -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 24%),radial-gradient(ellipse 135% 100% at 100% 0%,#000 calc(52% * var(--p)),rgba(0,0,0,.6) calc(72% * var(--p)),transparent calc(92% * var(--p)));-webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent 0%,#000 24%),radial-gradient(ellipse 135% 100% at 100% 0%,#000 calc(52% * var(--p)),rgba(0,0,0,.6) calc(72% * var(--p)),transparent calc(92% * var(--p)));mask-composite:intersect}
  .paint.boat{bottom:0;left:0;margin:0;transform:translate(-6%,6%);
    -webkit-mask-image:linear-gradient(to top,transparent 0%,#000 18%),radial-gradient(ellipse 100% 100% at 0% 100%,#000 calc(46% * var(--p)),rgba(0,0,0,.55) calc(68% * var(--p)),transparent calc(88% * var(--p)));-webkit-mask-composite:source-in;
    mask-image:linear-gradient(to top,transparent 0%,#000 18%),radial-gradient(ellipse 100% 100% at 0% 100%,#000 calc(46% * var(--p)),rgba(0,0,0,.55) calc(68% * var(--p)),transparent calc(88% * var(--p)));mask-composite:intersect}
  }
.page{flex:1 0 auto}
@media (min-width:1025px) and (max-height:760px){.prose p+p{margin-top:1.1em}}
/* the paintings spread out of their corner like wet paint, once, when the page opens */
@property --p{syntax:'<number>';inherits:false;initial-value:1}
@keyframes bleed{from{--p:.12;opacity:.15;filter:blur(5px) saturate(.35)}60%{opacity:1}to{--p:1;opacity:1;filter:none}}
.paint{animation:bleed 3.2s cubic-bezier(.22,.61,.36,1) .25s both;animation-play-state:paused}.paint.seen{animation-play-state:running}
@media (min-width:1025px) and (max-height:720px){h1{font-size:1.75rem;margin-bottom:12px}main{padding-top:18px;padding-bottom:24px}}
</style>
</head>
<body>
{% include nav.html current="history.html" %}
<div class="page">
<header>
  <div class="brand">
    <img class="wappen" src="img/maison-baer-wappen.webp" alt="" width="344" height="500">
    <span class="wm">Maison Baer</span>
  </div>
</header>

<main>
  <h1>{{ d.heading | escape }}</h1>
  <div class="prose">
{%- for p in d.paragraphs %}
    <p>{{ p }}</p>
{%- endfor %}
  </div>
</main>
<img class="paint boat" src="{{ d.painting.image }}" alt="{{ d.painting.alt | escape }}" width="880" height="1100" decoding="async">
</div>

{% include footer.html current="history.html" %}

<script>
/* start the paint effect only when a painting actually comes into view (matters on phones, where they sit below the text) */
(function(){var ps=document.querySelectorAll('.paint');if(!('IntersectionObserver' in window)){ps.forEach(function(p){p.classList.add('seen')});return}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('seen');io.unobserve(e.target)}})},{threshold:.25});
ps.forEach(function(p){io.observe(p)})})();
</script>
</body>
</html>
