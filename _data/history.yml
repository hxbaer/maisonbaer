heading: History
paragraphs:
- <em>Maison Baer</em> carries the name and arms of an old Zürich family.
- It began with a simple observation. The people most worth knowing rarely meet by chance. They work in different fields and see the world from different sides, yet share a way of thinking and a sense of where their lives are going.
- 'The club brings them to the same table. Not to network, but to talk: about ideas that do not fit into a message, and about views other than one&rsquo;s own.'
- What begins as an introduction becomes an acquaintance, and in time a friendship.
